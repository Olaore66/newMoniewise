<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Code</title>
  <style>
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f7; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; margin-top: 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .header { background-color: #F66C23; padding: 30px; text-align: center; }
    .header h1 { color: #ffffff; margin: 0; font-size: 24px; letter-spacing: 1px; font-weight: 600; }
    .content { padding: 40px; text-align: center; color: #51545E; }

    .otp-box {
      background-color: #f0f7ff;
      border: 2px dashed #F66C23;
      border-radius: 8px;
      padding: 20px;
      margin: 30px 0;
      display: inline-block;
      min-width: 200px;
    }

    .otp-code {
      font-size: 32px;
      font-weight: 800;
      color: #F66C23;
      letter-spacing: 5px;
      margin: 0;
    }

    .warning { font-size: 13px; color: #888; margin-top: 20px; }
    .footer { background-color: #f4f4f7; padding: 20px; text-align: center; font-size: 12px; color: #a8aaaf; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Wisemonie</h1>
  </div>

  <div class="content">
    <p>Hello,</p>
    <p>Please use the verification code below to complete your action.</p>

    <div class="otp-box">
      <h1 class="otp-code" th:text="${otpCode}">123456</h1>
    </div>

    <p class="warning">
      This code expires in <strong>10 minutes</strong>.<br>
      If you did not request this, please ignore this email.
    </p>
  </div>

  <div class="footer">
    <p>&copy; 2026 OLX Digital Services.</p>
  </div>
</div>
</body>
</html>
