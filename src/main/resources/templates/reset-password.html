<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; color: #333;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f9f9f9; padding: 40px 0;">
    <tr>
        <td align="center">
            <table width="100%" max-width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 12px; padding: 30px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);">
                <tr>
                    <td align="center" style="padding-bottom: 20px;">
                        <img src="C:\Users\abrah\Desktop\moniewiseUI\moniewise\images\logo.png" alt="Moniewise Logo" width="60" height="60" style="display:block;" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <h2 style="color: #333333; text-align: center;">Reset Your Password</h2>
                        <p style="font-size: 16px; color: #555555;">
                            Hi <strong th:text="${userName}">User</strong>,
                        </p>
                        <p style="font-size: 15px; color: #555555;">
                            We received a request to reset your password. To proceed, click the button below:
                        </p>

                        <div style="text-align: center; margin: 30px 0;">
                            <a th:href="${resetLink}" style="background-color: #F66C23; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; font-size: 15px; display: inline-block;">
                                Reset Password
                            </a>
                        </div>

                        <p style="font-size: 14px; color: #777777; text-align: center;">
                            Or use this link:<br>
                            <a th:href="${resetLink}" th:text="${resetLink}" style="color: #F66C23; word-break: break-all;"></a>
                        </p>

                        <p style="font-size: 14px; color: #777777;">
                            This link is valid for 10 minutes. If you didn’t request a password reset, feel free to ignore this email.
                        </p>

                        <p style="font-size: 14px; color: #777777;">Warm regards,<br><strong>The Moniewise Team</strong></p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
